name: Explorin variables and secrets

on:  
  workflow_dispatch:
  # schedule: 
  #   - cron: "*/1 * * * *"

  #push
env:
    CONTAINER_REGISTRY: docker.io
    IMAGE_NAME: github-actions-nginx
    DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}  
jobs:         
  ##### environment variables to job level #######
    docker:   
        runs-on: ubuntu-latest
        steps:
            - name: Docker Build
              run: echo docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
            
            - name: Docker Login
              run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u $DOCKER_USERNAME --password-stdin
           
            - name: Docker Publish
              run: echo docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
              
    deploy:
        if: github.ref == 'refs/heads/main'  
        needs: docker
        concurrency:
          group: production-deployment
          cancel-in-progess: true
        runs-on: ubuntu-latest
        steps:
            - name: Docker Run
              timeout-minutes: 1 #kill all min
              run: docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest                   